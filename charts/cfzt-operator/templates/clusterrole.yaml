apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cfzt-operator.fullname" . }}-manager
  labels:
    {{- include "cfzt-operator.labels" . | nindent 4 }}
rules:
  # cfzt CRs (D6: CloudflareTunnel cluster-scoped, CloudflareExposure namespaced).
  - apiGroups: ["cfzt.reid.ee"]
    resources: ["cloudflaretunnels", "cloudflareexposures"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cfzt.reid.ee"]
    resources: ["cloudflareaccesspolicies", "cloudflaretunnelroutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cfzt.reid.ee"]
    resources: ["cloudflaretunnels/status", "cloudflareexposures/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["cfzt.reid.ee"]
    resources: ["cloudflareaccesspolicies/status", "cloudflaretunnelroutes/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["cfzt.reid.ee"]
    resources: ["cloudflaretunnels/finalizers", "cloudflareexposures/finalizers"]
    verbs: ["update"]
  - apiGroups: ["cfzt.reid.ee"]
    resources: ["cloudflareaccesspolicies/finalizers", "cloudflaretunnelroutes/finalizers"]
    verbs: ["update"]
  # Credentials Secrets + operator-managed token Secrets.
  # Contract enforced in code: only writes Secrets named
  # `<CloudflareTunnel.metadata.name>-token` in cloudflared.namespace.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # cloudflared Pod termination checks during tunnel finalization.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # cloudflared DaemonSet per tunnel.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Slice 3 sourceRef derivation.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
  # Kubernetes Events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
  # HTTPRoute CRD detection at startup (Slice 3).
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
