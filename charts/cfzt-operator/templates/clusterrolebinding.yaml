apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cfzt-operator.fullname" . }}-manager
  labels:
    {{- include "cfzt-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cfzt-operator.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "cfzt-operator.serviceAccountName" . }}
    namespace: {{ include "cfzt-operator.namespace" . }}
