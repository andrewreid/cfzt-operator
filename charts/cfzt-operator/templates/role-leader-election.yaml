apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cfzt-operator.fullname" . }}-leader-election
  namespace: {{ include "cfzt-operator.namespace" . }}
  labels:
    {{- include "cfzt-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
