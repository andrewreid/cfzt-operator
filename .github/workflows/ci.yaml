name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HELM_VERSION: "v3.22.0"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0

      - name: module, source, and dependency advisories
        run: make security

      - name: go vet
        run: go vet ./...

      # Use `make lint` to build the custom golangci-lint binary that includes
      # the logcheck module plugin (see .custom-gcl.yml). The plain
      # golangci-lint-action cannot install module plugins.
      - name: golangci-lint
        run: make lint

      - name: generated drift check
        run: |
          make manifests generate
          make helm-sync-crds
          git diff --exit-code

      - name: unit + envtest
        run: make test

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint
        run: helm lint charts/cfzt-operator

      - name: upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-ci
          path: bin/security/
          if-no-files-found: warn
