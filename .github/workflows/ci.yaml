name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  HELM_VERSION: "v3.16.0"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet ./...

      # Use `make lint` to build the custom golangci-lint binary that includes
      # the logcheck module plugin (see .custom-gcl.yml). The plain
      # golangci-lint-action cannot install module plugins.
      - name: golangci-lint
        run: make lint

      - name: generated drift check
        run: |
          make manifests generate
          git diff --exit-code

      - name: unit + envtest
        run: make test

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: helm lint
        run: helm lint charts/cfzt-operator
