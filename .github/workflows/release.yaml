name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: andrewreid/cfzt-operator
  CHART_REPO: oci://ghcr.io/andrewreid/charts
  SMOKE_IMAGE: cfzt-operator:release-smoke
  KIND_CLUSTER: cfzt-release-smoke
  LIVE_KIND_CLUSTER: cfzt-live-smoke

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: derive version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" =~ - ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image tags
        id: tags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}"
          if [[ "${{ steps.version.outputs.prerelease }}" == "false" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: build smoke image
        run: docker build --platform linux/amd64 -t "${SMOKE_IMAGE}" .

      - name: create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          wait: 120s

      - name: load smoke image
        run: kind load docker-image "${SMOKE_IMAGE}" --name "${KIND_CLUSTER}"

      - name: smoke test chart on kind
        run: |
          helm install cfzt-operator charts/cfzt-operator \
            --namespace cfzt-system \
            --create-namespace \
            --set image.repository=cfzt-operator \
            --set image.tag=release-smoke \
            --set image.pullPolicy=Never \
            --set replicaCount=1
          kubectl -n cfzt-system rollout status deploy/cfzt-operator --timeout=180s
          kubectl get crd cloudflaretunnels.cfzt.reid.ee
          kubectl get crd cloudflareexposures.cfzt.reid.ee
          kubectl get crd cloudflareaccesspolicies.cfzt.reid.ee
          kubectl -n cfzt-system get pods -l app.kubernetes.io/name=cfzt-operator

      - name: build + push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: package + push chart
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          helm package charts/cfzt-operator \
            --version "${VERSION}" \
            --app-version "${TAG}" \
            --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login \
            -u "${{ github.actor }}" --password-stdin "${{ env.REGISTRY }}"
          helm push "dist/cfzt-operator-${VERSION}.tgz" "${{ env.CHART_REPO }}"

      - name: github release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}

  live-cloudflare-smoke:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: live-cloudflare-smoke
    concurrency: live-cloudflare-smoke
    permissions:
      contents: read
      packages: read
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_TEST_ZONE: ${{ vars.CF_TEST_ZONE }}
      CHART_REF: oci://ghcr.io/andrewreid/charts/cfzt-operator
      IMAGE_REPOSITORY: ghcr.io/andrewreid/cfzt-operator
      IMAGE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.0

      - name: log in to ghcr for helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login \
            -u "${{ github.actor }}" --password-stdin "${{ env.REGISTRY }}"

      - name: log in to ghcr for image pull
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.LIVE_KIND_CLUSTER }}
          wait: 120s

      - name: load released image
        run: |
          docker pull "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          kind load docker-image "${IMAGE_REPOSITORY}:${IMAGE_TAG}" --name "${{ env.LIVE_KIND_CLUSTER }}"

      - name: live smoke against Cloudflare
        run: hack/live-cloudflare-smoke.sh
