name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without a leading v, for example 0.2.3
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: andrewreid/cfzt-operator
  CHART_REPO: oci://ghcr.io/andrewreid/charts
  CANDIDATE_IMAGE_REPOSITORY: cfzt-operator
  CANDIDATE_IMAGE_TAG: release-candidate
  KIND_CLUSTER: cfzt-release-smoke
  LIVE_KIND_CLUSTER: cfzt-live-smoke
  HELM_VERSION: v3.22.0

jobs:
  release-gates:
    name: release gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency: live-cloudflare-smoke
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tag_exists: ${{ steps.version.outputs.tag_exists }}
      image_name: ${{ steps.version.outputs.image_name }}
      image_tags: ${{ steps.version.outputs.image_tags }}
      chart_package_name: ${{ steps.version.outputs.chart_package_name }}
    env:
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_TEST_ZONE: ${{ secrets.CF_TEST_ZONE || vars.CF_TEST_ZONE }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID || vars.CF_ZONE_ID }}
      CF_SMOKE_ROUTE_CIDR: ${{ vars.CF_SMOKE_ROUTE_CIDR }}
      CF_SMOKE_ROUTE_CONFLICT_CIDR: ${{ vars.CF_SMOKE_ROUTE_CONFLICT_CIDR }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: derive version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Releases must be run from main; got ${GITHUB_REF}" >&2
            exit 1
          fi

          VERSION="${INPUT_VERSION#v}"
          TAG="v${VERSION}"

          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version must look like 0.2.3 or 0.2.3-alpha.1; got ${INPUT_VERSION}" >&2
            exit 1
          fi

          git fetch --tags origin

          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_EXISTS=true
            TAG_SHA="$(git rev-list -n 1 "${TAG}")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [[ "${TAG_SHA}" != "${HEAD_SHA}" ]]; then
              echo "Tag ${TAG} already exists at ${TAG_SHA}, not current HEAD ${HEAD_SHA}" >&2
              exit 1
            fi
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists" >&2
            exit 1
          fi

          PRERELEASE=false
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE=true
          fi

          IMAGE_TAGS="${REGISTRY}/${IMAGE_NAME}:${TAG}"
          if [[ "${PRERELEASE}" == "false" ]]; then
            IMAGE_TAGS="${IMAGE_TAGS},${REGISTRY}/${IMAGE_NAME}:latest"
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "prerelease=${PRERELEASE}"
            echo "tag_exists=${TAG_EXISTS}"
            echo "image_name=${REGISTRY}/${IMAGE_NAME}"
            echo "image_tags=${IMAGE_TAGS}"
            echo "chart_package_name=cfzt-operator-${VERSION}.tgz"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0

      - name: module, source, and dependency advisories
        run: make security

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: make lint

      - name: generated drift check
        run: |
          make manifests generate
          make helm-sync-crds
          git diff --exit-code

      - name: unit + envtest
        run: make test

      - name: helm lint
        run: helm lint charts/cfzt-operator

      - name: package candidate chart
        run: |
          mkdir -p dist
          helm package charts/cfzt-operator \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.tag }}" \
            --destination dist

      - name: build candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.CANDIDATE_IMAGE_REPOSITORY }}:${{ env.CANDIDATE_IMAGE_TAG }}
          cache-from: type=gha,scope=operator-image-candidate
          cache-to: type=gha,mode=max,scope=operator-image-candidate

      - name: create chart smoke kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}
          wait: 120s

      - name: load candidate image for chart smoke
        run: kind load docker-image "${CANDIDATE_IMAGE_REPOSITORY}:${CANDIDATE_IMAGE_TAG}" --name "${KIND_CLUSTER}"

      - name: smoke test candidate chart on kind
        run: |
          helm install cfzt-operator "dist/${{ steps.version.outputs.chart_package_name }}" \
            --namespace cfzt-system \
            --create-namespace \
            --set image.repository="${CANDIDATE_IMAGE_REPOSITORY}" \
            --set image.tag="${CANDIDATE_IMAGE_TAG}" \
            --set image.pullPolicy=Never \
            --set replicaCount=1
          kubectl -n cfzt-system rollout status deploy/cfzt-operator --timeout=180s
          kubectl get crd cloudflaretunnels.cfzt.reid.ee
          kubectl get crd cloudflareexposures.cfzt.reid.ee
          kubectl get crd cloudflareaccesspolicies.cfzt.reid.ee
          kubectl get crd cloudflaretunnelroutes.cfzt.reid.ee
          kubectl -n cfzt-system get pods -l app.kubernetes.io/name=cfzt-operator

      - name: delete chart smoke kind cluster
        run: kind delete cluster --name "${KIND_CLUSTER}"

      - name: validate Cloudflare smoke environment
        run: go test -tags=live ./test/live -run '^TestCloudflarePreflight$' -count=1 -timeout=5m -v

      - name: create live smoke kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: ${{ env.LIVE_KIND_CLUSTER }}
          wait: 120s

      - name: load candidate image for live smoke
        run: kind load docker-image "${CANDIDATE_IMAGE_REPOSITORY}:${CANDIDATE_IMAGE_TAG}" --name "${LIVE_KIND_CLUSTER}"

      - name: live smoke candidate against Cloudflare
        env:
          CHART_REF: ./dist/${{ steps.version.outputs.chart_package_name }}
          IMAGE_REPOSITORY: ${{ env.CANDIDATE_IMAGE_REPOSITORY }}
          IMAGE_TAG: ${{ env.CANDIDATE_IMAGE_TAG }}
        run: go test -tags=live ./test/live -run '^TestCloudflareLifecycle$' -count=1 -timeout=30m -v

      - name: upload release chart package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-chart-package
          path: dist/${{ steps.version.outputs.chart_package_name }}
          if-no-files-found: error
          retention-days: 1

      - name: upload source security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-security-source
          path: bin/security/
          if-no-files-found: warn

  build-release-image:
    name: build release ${{ matrix.platform }}
    needs: release-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_pair: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            platform_pair: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          platforms: ${{ matrix.platform }}

      - name: log in to ghcr for images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-gates.outputs.tag }}
          outputs: type=image,name=${{ needs.release-gates.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=operator-image-${{ matrix.platform_pair }}
          cache-to: type=gha,mode=max,scope=operator-image-${{ matrix.platform_pair }}

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0

      - name: gate native image advisories
        env:
          IMAGE_REF: ${{ needs.release-gates.outputs.image_name }}@${{ steps.build.outputs.digest }}
          SECURITY_IMAGE_PLATFORM: ${{ matrix.platform }}
        run: make security-image IMG="${IMAGE_REF}"

      - name: upload native image security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-security-${{ matrix.platform_pair }}
          path: bin/security/
          if-no-files-found: warn

      - name: export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-digests-${{ matrix.platform_pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-release-image:
    name: merge release image
    needs:
      - release-gates
      - build-release-image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: log in to ghcr for images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: /tmp/digests
          pattern: release-digests-*
          merge-multiple: true

      - name: create release image manifest
        working-directory: /tmp/digests
        env:
          IMAGE_TAGS: ${{ needs.release-gates.outputs.image_tags }}
          IMAGE_NAME: ${{ needs.release-gates.outputs.image_name }}
        run: |
          tag_args=()
          sources=()
          IFS=',' read -ra refs <<< "${IMAGE_TAGS}"
          for ref in "${refs[@]}"; do
            tag_args+=("-t" "${ref}")
          done
          for digest in *; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${sources[@]}"

      - name: verify release image
        run: docker buildx imagetools inspect "${{ needs.release-gates.outputs.image_name }}:${{ needs.release-gates.outputs.tag }}"

  publish-release:
    name: publish release chart
    needs:
      - release-gates
      - merge-release-image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: log in to ghcr for image verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: download release chart package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-chart-package
          path: dist

      - name: verify release image
        run: docker buildx imagetools inspect "${{ needs.release-gates.outputs.image_name }}:${{ needs.release-gates.outputs.tag }}"

      - name: push release chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login \
            -u "${{ github.actor }}" --password-stdin "${REGISTRY}"
          helm push "dist/${{ needs.release-gates.outputs.chart_package_name }}" "${CHART_REPO}"

      - name: verify release chart
        run: helm show chart "${CHART_REPO}/cfzt-operator" --version "${{ needs.release-gates.outputs.version }}"

      - name: create git tag
        env:
          TAG: ${{ needs.release-gates.outputs.tag }}
          TAG_EXISTS: ${{ needs.release-gates.outputs.tag_exists }}
        run: |
          if [[ "${TAG_EXISTS}" == "true" ]]; then
            echo "Tag ${TAG} already exists at this commit; reusing it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: github release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.release-gates.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ needs.release-gates.outputs.prerelease == 'true' }}
