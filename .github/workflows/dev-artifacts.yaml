name: dev-artifacts

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: andrewreid/cfzt-operator
  CHART_REPO: oci://ghcr.io/andrewreid/charts
  HELM_VERSION: v3.16.0

jobs:
  publish:
    name: publish dev artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == 'main' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-dev]'))
    concurrency:
      group: dev-artifacts-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: derive dev version
        id: version
        run: |
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          DEV_VERSION="0.0.0-dev.sha-${SHORT_SHA}"
          {
            echo "short_sha=${SHORT_SHA}"
            echo "version=${DEV_VERSION}"
            echo "image_ref=${REGISTRY}/${IMAGE_NAME}:${DEV_VERSION}"
            echo "chart_package=dist/cfzt-operator-${DEV_VERSION}.tgz"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: log in to ghcr for images
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: log in to ghcr for charts
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login \
            -u "${{ github.actor }}" --password-stdin "${REGISTRY}"

      - name: refuse existing dev artifacts
        run: |
          if docker buildx imagetools inspect "${{ steps.version.outputs.image_ref }}" >/dev/null 2>&1; then
            echo "Image already exists: ${{ steps.version.outputs.image_ref }}" >&2
            exit 1
          fi
          if helm show chart "${CHART_REPO}/cfzt-operator" --version "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Chart already exists: ${CHART_REPO}/cfzt-operator --version ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi

      - name: generated drift check
        run: |
          make manifests generate
          make helm-sync-crds
          git diff --exit-code

      - name: unit + envtest
        run: make test

      - name: helm lint
        run: helm lint charts/cfzt-operator

      - name: package dev chart
        run: |
          helm package charts/cfzt-operator \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist

      - name: build + push dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.image_ref }}
          cache-from: type=gha,scope=operator-image
          cache-to: type=gha,mode=max,scope=operator-image

      - name: verify dev image
        run: docker buildx imagetools inspect "${{ steps.version.outputs.image_ref }}"

      - name: push dev chart
        run: helm push "${{ steps.version.outputs.chart_package }}" "${CHART_REPO}"

      - name: verify dev chart
        run: helm show chart "${CHART_REPO}/cfzt-operator" --version "${{ steps.version.outputs.version }}"

      - name: summary
        run: |
          {
            echo "## Dev artifacts"
            echo
            echo "Image: \`${{ steps.version.outputs.image_ref }}\`"
            echo "Chart: \`${CHART_REPO}/cfzt-operator --version ${{ steps.version.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
