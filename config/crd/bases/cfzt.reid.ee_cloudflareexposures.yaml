---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: cloudflareexposures.cfzt.reid.ee
spec:
  group: cfzt.reid.ee
  names:
    kind: CloudflareExposure
    listKind: CloudflareExposureList
    plural: cloudflareexposures
    shortNames:
    - cfe
    singular: cloudflareexposure
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.hostname
      name: Hostname
      type: string
    - jsonPath: .spec.tunnelRef.name
      name: Tunnel
      type: string
    - jsonPath: .spec.access.enabled
      name: Access
      type: boolean
    - jsonPath: .status.failover.role
      name: Role
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: CloudflareExposure is the Schema for the cloudflareexposures
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: CloudflareExposureSpec defines the desired state of CloudflareExposure.
            properties:
              access:
                default: {}
                description: AccessSpec controls Cloudflare Access protection.
                properties:
                  applications:
                    items:
                      description: |-
                        AccessApplicationTarget describes one Cloudflare Access self-hosted
                        application owned by a CloudflareExposure.
                      properties:
                        domains:
                          description: |-
                            Domains is the ordered list of self-hosted domain targets for this Access
                            application. The first entry is the Cloudflare primary domain.
                          items:
                            description: |-
                              AccessApplicationDomain is one canonical self-hosted domain target for an
                              Access application.
                            maxLength: 253
                            pattern: ^[^\s?#:]+(?:/[^\s?#:]*)?$
                            type: string
                          maxItems: 3
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: atomic
                        name:
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        policies:
                          items:
                            description: |-
                              AccessApplicationPolicyBinding references one policy attached to an Access
                              application. The policy ref shape stays shared with the legacy top-level
                              access.policyRef field, but only nested bindings are accepted in v1alpha1.
                            properties:
                              policyRef:
                                description: AccessPolicyRef points at an existing
                                  Cloudflare Access policy.
                                properties:
                                  name:
                                    maxLength: 253
                                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                    type: string
                                  uuid:
                                    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                                    type: string
                                type: object
                            required:
                            - policyRef
                            type: object
                            x-kubernetes-validations:
                            - message: policyRef requires exactly one of uuid or name
                              rule: (has(self.policyRef.uuid) && size(self.policyRef.uuid)
                                > 0) != (has(self.policyRef.name) && size(self.policyRef.name)
                                > 0)
                          maxItems: 3
                          minItems: 1
                          type: array
                      required:
                      - domains
                      - name
                      - policies
                      type: object
                    maxItems: 3
                    minItems: 1
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  enabled:
                    default: false
                    type: boolean
                  policyRef:
                    description: AccessPolicyRef points at an existing Cloudflare
                      Access policy.
                    properties:
                      name:
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      uuid:
                        pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                        type: string
                    type: object
                type: object
              displayName:
                maxLength: 120
                type: string
              failover:
                description: |-
                  FailoverSpec opts a CloudflareExposure into D26 active-passive multi-cluster
                  DR. Two Exposures applied to two clusters with matching spec.failover.group
                  and distinct --site-id cooperate over one hostname via a Cloudflare DNS TXT
                  lease record; exactly one cluster is Primary and writes the shared CNAME +
                  Access app, the other warms its tunnel and waits.
                properties:
                  group:
                    description: |-
                      Group is the cross-cluster identity for this logical exposure. It is
                      explicitly user-supplied (not derived from hostname) so renaming a
                      hostname does not silently break the failover relationship. RFC 1123
                      label, min 3 / max 63 chars.
                    maxLength: 63
                    minLength: 3
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  leaseSeconds:
                    default: 60
                    description: |-
                      LeaseSeconds is the TTL of the DNS TXT lease record. The Primary
                      renews at leaseSeconds/2. Default 60s; min 30s (Cloudflare DNS TTL
                      floor + safe renewer headroom); max 600s (caps split-brain window).
                    format: int32
                    maximum: 600
                    minimum: 30
                    type: integer
                  promotionPolicy:
                    default: Automatic
                    description: |-
                      PromotionPolicy controls how this site becomes Primary. Automatic
                      (default) auto-acquires the lease on TTL expiry — the liveness-driven
                      D26 behaviour. Manual never auto-acquires (on expiry or on an absent
                      day-1 lease); the only promotion trigger, including the first election,
                      is the cfzt.reid.ee/force-promote token. Use Manual for stateful
                      services whose failover must follow out-of-band recovery and be
                      deliberate.
                    enum:
                    - Automatic
                    - Manual
                    type: string
                required:
                - group
                type: object
              hostname:
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)+$
                type: string
              origin:
                description: OriginSpec describes the origin cloudflared should proxy
                  to.
                properties:
                  host:
                    minLength: 1
                    type: string
                  port:
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  protocol:
                    enum:
                    - http
                    - https
                    type: string
                type: object
              sourceRef:
                description: SourceRef identifies a same-namespace source object used
                  for defaulting.
                properties:
                  apiVersion:
                    type: string
                  kind:
                    enum:
                    - Service
                    - HTTPRoute
                    minLength: 1
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
                x-kubernetes-validations:
                - message: sourceRef.apiVersion must be v1 for Service and gateway.networking.k8s.io/v1
                    for HTTPRoute
                  rule: (self.kind == 'Service' && has(self.apiVersion) && self.apiVersion
                    == 'v1') || (self.kind == 'HTTPRoute' && has(self.apiVersion)
                    && self.apiVersion == 'gateway.networking.k8s.io/v1')
              tunnelRef:
                description: TunnelRef identifies the CloudflareTunnel that publishes
                  this exposure.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - tunnelRef
            type: object
            x-kubernetes-validations:
            - message: origin protocol, host, and port are required unless sourceRef.kind
                is Service
              rule: (has(self.sourceRef) && self.sourceRef.kind == 'Service') || (has(self.origin)
                && has(self.origin.protocol) && has(self.origin.host) && has(self.origin.port))
            - message: hostname is required unless sourceRef.kind is HTTPRoute and
                access is disabled
              rule: has(self.hostname) || (has(self.sourceRef) && self.sourceRef.kind
                == 'HTTPRoute' && (!has(self.access) || !self.access.enabled))
            - message: access.enabled=true requires spec.hostname and access.applications[]
              rule: '!has(self.access) || !self.access.enabled || (has(self.hostname)
                && size(self.hostname) > 0 && has(self.access.applications) && size(self.access.applications)
                > 0)'
            - message: access.policyRef was removed in v1alpha1; use access.applications[]
              rule: '!has(self.access) || !has(self.access.policyRef)'
            - message: access.applications[].domains must equal spec.hostname or start
                with spec.hostname + "/"
              rule: '!has(self.access) || !self.access.enabled || self.access.applications.all(app,
                app.domains.all(domain, domain == self.hostname || domain.startsWith(self.hostname
                + ''/'')))'
            - message: hostname is immutable except when initially derived from an
                HTTPRoute sourceRef
              rule: 'has(oldSelf.hostname) ? (has(self.hostname) && self.hostname
                == oldSelf.hostname) : (!has(self.hostname) || (has(self.sourceRef)
                && self.sourceRef.kind == ''HTTPRoute''))'
            - message: tunnelRef.name is immutable
              rule: self.tunnelRef.name == oldSelf.tunnelRef.name
            - message: sourceRef is immutable
              rule: has(self.sourceRef) == has(oldSelf.sourceRef) && (!has(self.sourceRef)
                || self.sourceRef == oldSelf.sourceRef)
          status:
            description: CloudflareExposureStatus defines the observed state of CloudflareExposure.
            properties:
              cloudflare:
                description: ExposureCloudflareStatus records Cloudflare-side resources
                  for one exposure.
                properties:
                  accessApplications:
                    items:
                      description: |-
                        ExposureAccessApplicationStatus records one reconciled Access application for
                        a CloudflareExposure.
                      properties:
                        appId:
                          type: string
                        canonicalDomainHash:
                          type: string
                        name:
                          minLength: 1
                          type: string
                        policyHash:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  dnsRecordId:
                    type: string
                  publicHostnameRouteHash:
                    type: string
                type: object
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              failover:
                description: |-
                  Failover is this site's view of the D26 failover lease. Empty
                  (zero-valued) when spec.failover is unset.
                properties:
                  lastForcePromoteToken:
                    description: |-
                      LastForcePromoteToken is the most recent cfzt.reid.ee/force-promote
                      annotation value this site has honored. A force-promote fires only
                      when the annotation token differs from this, so a GitOps re-apply of
                      the same token does not replay the emergency promotion (D26).
                    type: string
                  lastRoleTransitionAt:
                    description: |-
                      LastRoleTransitionAt records the most recent Role change observed
                      by this site.
                    format: date-time
                    type: string
                  leaseExpiresAt:
                    description: |-
                      LeaseExpiresAt is the lease expiry read from / written to the
                      lease TXT record.
                    format: date-time
                    type: string
                  leaseOwner:
                    description: |-
                      LeaseOwner is the site-id last observed holding the lease (may be
                      this site or a peer).
                    type: string
                  leaseRenewedAt:
                    description: |-
                      LeaseRenewedAt is the last successful renewal by this site as
                      Primary; empty on Standby.
                    format: date-time
                    type: string
                  observedPrimaryTunnelId:
                    description: |-
                      ObservedPrimaryTunnelID is the Cloudflare tunnel ID the current
                      Primary published in the lease record (split-brain diagnostic).
                    type: string
                  role:
                    description: Role is this site's current failover role.
                    enum:
                    - Unknown
                    - Standby
                    - Primary
                    type: string
                  siteId:
                    description: |-
                      SiteID is this operator process's --site-id, recorded on every
                      status write so external operators can correlate role + identity.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
