---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - cfzt.reid.ee
  resources:
  - cloudflareexposures
  - cloudflaretunnels
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cfzt.reid.ee
  resources:
  - cloudflareexposures/finalizers
  - cloudflaretunnels/finalizers
  verbs:
  - update
- apiGroups:
  - cfzt.reid.ee
  resources:
  - cloudflareexposures/status
  - cloudflaretunnels/status
  verbs:
  - get
  - patch
  - update
