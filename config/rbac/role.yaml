---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - daemonsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cfzt.reid.ee
  resources:
  - cloudflareaccesspolicies
  - cloudflareexposures
  - cloudflaretunnelroutes
  - cloudflaretunnels
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cfzt.reid.ee
  resources:
  - cloudflareaccesspolicies/finalizers
  - cloudflareexposures/finalizers
  - cloudflaretunnelroutes/finalizers
  - cloudflaretunnels/finalizers
  verbs:
  - update
- apiGroups:
  - cfzt.reid.ee
  resources:
  - cloudflareaccesspolicies/status
  - cloudflareexposures/status
  - cloudflaretunnelroutes/status
  - cloudflaretunnels/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - httproutes
  verbs:
  - get
  - list
  - watch
