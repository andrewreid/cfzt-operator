# This rule is not used by the project cfzt-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the cfzt.reid.ee.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: cfzt-operator
    app.kubernetes.io/managed-by: kustomize
  name: cloudflareexposure-editor-role
rules:
- apiGroups:
  - cfzt.reid.ee
  resources:
  - cloudflareexposures
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cfzt.reid.ee
  resources:
  - cloudflareexposures/status
  verbs:
  - get
